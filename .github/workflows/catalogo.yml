name: Catalogo

# Rigenera il catalogo e lo pubblica su Vercel a ogni modifica del branch principale.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo aggiornamento alla volta: due push ravvicinati non si pestano i piedi.
concurrency:
  group: catalogo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  genera-e-pubblica:
    # I push fatti con il GITHUB_TOKEN non avviano altre Action, quindi il commit
    # "chore: rigenera catalogo" non crea cicli. Questo controllo è una sicurezza in più.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: strumenti/requirements.txt

      - name: Installa dipendenze
        run: pip install -r strumenti/requirements.txt

      - name: Test
        run: python -m pytest -m "not browser" -q

      - name: Genera catalogo
        run: python strumenti/genera_catalogo.py

      - name: Committa il catalogo aggiornato
        run: |
          if [ -n "$(git status --porcelain catalogo INVENTARIO.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalogo INVENTARIO.md
            git commit -m "chore: rigenera catalogo"
            # Se nel frattempo è arrivato un altro push, lo integra invece di fallire.
            git pull --rebase
            git push
          fi

      - name: Pubblica su Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Servono tutti e tre: senza ORG/PROJECT la CLI creerebbe un progetto nuovo.
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Secret Vercel mancanti (servono VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID): catalogo generato ma non pubblicato."
            exit 0
          fi
          npx --yes vercel@50.38.0 deploy catalogo --prod --yes --token "$VERCEL_TOKEN"
